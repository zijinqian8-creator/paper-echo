<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F9F6F0">
  <title>纸间回响 · 小故事阅读平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* 原有样式保持不变（略... 完整样式请见上一版本） */
    :root {
      --bg-page: #F9F6F0;
      --surface: #FFFFFF;
      --text-primary: #2C2C2C;
      --text-secondary: #8A8A8A;
      --brand: #C46B3E;
      --brand-dark: #A5572E;
      --border: rgba(196, 107, 62, 0.2);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius-card: 24px;
      --radius-btn: 40px;
      --radius-input: 12px;
      --transition: all 0.2s ease;
    }
    body.dark {
      --bg-page: #1a1a2e;
      --surface: #2d2d44;
      --text-primary: #E0E0E0;
      --text-secondary: #A0A0A0;
      --brand: #E0A878;
      --brand-dark: #C4885A;
      --border: rgba(224, 168, 120, 0.3);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: var(--transition);
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-page); }
    ::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 3px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-btn);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      background: none;
      font-size: 1rem;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: var(--brand-dark); transform: scale(0.98); }
    .btn-outline { border: 1px solid var(--brand); color: var(--brand); background: transparent; }
    .btn-outline:hover { background: var(--brand); color: white; }
    .input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(196,107,62,0.2); }
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .admin-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .admin-layout { grid-template-columns: 1fr; } .story-grid { grid-template-columns: 1fr; } }
    .story-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .story-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .card-title { font-weight: bold; font-size: 1.2rem; line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .read-badge { color: #2ecc71; font-size: 0.9rem; }
    .category-badge {
      background: var(--brand);
      color: white;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .category-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: var(--surface);
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid var(--border);
    }
    .filter-btn {
      background: transparent;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-primary);
    }
    .filter-btn.active { background: var(--brand); color: white; }
    .reading-container { touch-action: pan-y pinch-zoom; min-height: 60vh; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-family: 'Georgia', serif; }
    h2 { font-size: clamp(1.3rem, 4vw, 1.8rem); }
    .hidden { display: none !important; }
    .page-indicator { font-size: 0.9rem; color: var(--text-secondary); }
    .reading-header { text-align: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 2px solid var(--border); position: relative; }
    .reading-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 12px; line-height: 1.3; }
    .reading-category { display: inline-block; background: var(--brand); color: white; padding: 4px 14px; border-radius: 40px; font-size: 0.85rem; }
    .user-table, .invite-table { width: 100%; border-collapse: collapse; }
    .user-table th, .user-table td, .invite-table th, .invite-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; }
    .status-active { background: #2ecc71; color: white; }
    .status-disabled { background: #e74c3c; color: white; }
    .status-used { background: #95a5a6; color: white; }
    .admin-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 1rem; color: var(--text-secondary); }
    .tab-btn.active { color: var(--brand); border-bottom: 2px solid var(--brand); }
    .link-btn { background: none; border: none; color: var(--brand); cursor: pointer; text-decoration: underline; }
    /* 新增已读按钮样式 */
    .mark-read-btn { margin-left: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ==================== 硬编码管理员账号 ====================
    const ADMIN_PHONE = '17276723635';
    const ADMIN_PASSWORD = 'wxz970107wxZ';

    // ==================== 存储 Keys ====================
    const STORAGE_KEYS = {
      STORIES: 'paper_echo_stories',
      USERS: 'paper_echo_users',
      INVITE_CODES: 'paper_echo_invite_codes',
      LOGIN_TOKEN: 'paper_echo_token'
    };

    // ==================== 默认数据初始化 ====================
    const DEFAULT_STORIES = [
      {
        id: 1,
        title: "深夜妈妈的眼泪",
        category: "亲情",
        callerStory: "孩子三岁了，总是无缘无故哭闹。我试过讲道理、冷处理、甚至吼他，都没用。昨晚他又哭了一个小时，我彻底崩溃了，觉得自己是个失败的妈妈。",
        hostReply: "第一，哭是孩子唯一的语言，他在求助而不是对抗。\n第二，你可以尝试‘情绪暂停角’，先抱抱自己。\n第三，给他一个‘哭完拥抱’的承诺，他会建立安全感。\n第四，每天睡前聊三件开心小事，逐渐转移注意力。\n第五，妈妈也需要喘息，每周留两小时给自己，那不是自私。"
      },
      {
        id: 2,
        title: "外卖骑手的秘密",
        category: "职场",
        callerStory: "我跑单三年，每天都像机器人。上个月差点出车祸，停下来那一刻我突然问自己：如果明天死了，我活过吗？",
        hostReply: "第一，你已经在问这个问题，说明你还活着。\n第二，试着把‘送餐’变成‘送一个温暖的微笑’。\n第三，每天记录一件让你感动的小事，哪怕是一声谢谢。\n第四，规划每个月一天完全属于自己的时间。\n第五，你不仅是骑手，更是城市夜晚的守夜人。"
      },
      {
        id: 3,
        title: "退休教师的焦虑",
        category: "人生",
        callerStory: "教书三十年，突然不用去学校了，我觉得自己像被抽空。老伴说我脾气变差，我也不知道怎么了。",
        hostReply: "第一，失去身份感会带来恐慌，这是正常的。\n第二，尝试每周做两次‘志愿者教师’，哪怕线上。\n第三，培养一个与教学完全无关的爱好，比如种花。\n第四，和老伴每天散步半小时，重建亲密节奏。\n第五，你的价值从不只在工作，而在你曾经点亮过的生命。"
      }
    ];

    // 工具函数
    function getStorage(key, defaultValue) {
      const stored = localStorage.getItem(key);
      if (stored) return JSON.parse(stored);
      localStorage.setItem(key, JSON.stringify(defaultValue));
      return defaultValue;
    }
    function setStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    // 生成随机邀请码 (8位字母数字)
    function generateInviteCode() {
      return Math.random().toString(36).substring(2, 10).toUpperCase();
    }

    // ==================== 已读功能相关 ====================
    // 获取用户已读的故事ID集合
    function getUserReadSet(userId) {
      const key = `paper_echo_read_${userId}`;
      const stored = localStorage.getItem(key);
      if (stored) return new Set(JSON.parse(stored));
      return new Set();
    }
    // 保存用户已读集合
    function saveUserReadSet(userId, readSet) {
      const key = `paper_echo_read_${userId}`;
      localStorage.setItem(key, JSON.stringify([...readSet]));
    }
    // 检查故事是否已读
    function isStoryRead(userId, storyId) {
      if (!userId) return false;
      const readSet = getUserReadSet(userId);
      return readSet.has(storyId);
    }
    // 标记故事为已读（不可逆）
    function markStoryRead(userId, storyId) {
      if (!userId) return;
      const readSet = getUserReadSet(userId);
      if (readSet.has(storyId)) return;
      readSet.add(storyId);
      saveUserReadSet(userId, readSet);
    }

    // 全局状态
    let currentUser = null;
    let currentView = 'login';
    let currentStoryId = null;
    let darkMode = localStorage.getItem('theme') === 'dark';
    let adminTab = 'stories';

    // 数据
    let stories = getStorage(STORAGE_KEYS.STORIES, DEFAULT_STORIES);
    let users = getStorage(STORAGE_KEYS.USERS, []);
    let inviteCodes = getStorage(STORAGE_KEYS.INVITE_CODES, []);

    // 辅助函数
    function saveStories() { setStorage(STORAGE_KEYS.STORIES, stories); }
    function saveUsers() { setStorage(STORAGE_KEYS.USERS, users); }
    function saveInviteCodes() { setStorage(STORAGE_KEYS.INVITE_CODES, inviteCodes); }

    // 设置登录 token (30天有效期)
    function setLoginToken(userData) {
      const token = {
        data: userData,
        expire: Date.now() + 30 * 24 * 60 * 60 * 1000
      };
      localStorage.setItem(STORAGE_KEYS.LOGIN_TOKEN, JSON.stringify(token));
    }
    function getLoginToken() {
      const tokenStr = localStorage.getItem(STORAGE_KEYS.LOGIN_TOKEN);
      if (!tokenStr) return null;
      try {
        const token = JSON.parse(tokenStr);
        if (token.expire && token.expire > Date.now()) {
          return token.data;
        }
      } catch(e) {}
      localStorage.removeItem(STORAGE_KEYS.LOGIN_TOKEN);
      return null;
    }
    function clearLoginToken() {
      localStorage.removeItem(STORAGE_KEYS.LOGIN_TOKEN);
    }

    function logout() {
      clearLoginToken();
      currentUser = null;
      currentView = 'login';
      render();
    }

    function hashPassword(pwd) { return pwd; }

    // 注册新用户
    function registerUser(phone, password, inviteCode) {
      const invite = inviteCodes.find(c => c.code === inviteCode && !c.used);
      if (!invite) return { success: false, message: '邀请码无效或已被使用' };
      if (users.find(u => u.phone === phone)) return { success: false, message: '手机号已注册' };
      const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;
      const newUser = {
        id: newId,
        phone: phone,
        password: hashPassword(password),
        nickname: `用户${phone.slice(-4)}`,
        status: 'active',
        inviteCode: inviteCode,
        createdAt: new Date().toISOString()
      };
      users.push(newUser);
      saveUsers();
      invite.used = true;
      invite.usedByUserId = newId;
      invite.usedAt = new Date().toISOString();
      saveInviteCodes();
      return { success: true, user: newUser };
    }

    function loginUser(phone, password) {
      const user = users.find(u => u.phone === phone && u.password === hashPassword(password) && u.status === 'active');
      if (!user) return null;
      return { type: 'user', userId: user.id, phone: user.phone, nickname: user.nickname };
    }

    function loginAdmin(phone, password) {
      if (phone === ADMIN_PHONE && password === ADMIN_PASSWORD) {
        return { type: 'admin' };
      }
      return null;
    }

    function toggleUserStatus(userId) {
      const user = users.find(u => u.id === userId);
      if (user) {
        user.status = user.status === 'active' ? 'disabled' : 'active';
        saveUsers();
        return true;
      }
      return false;
    }

    function deleteUser(userId) {
      const idx = users.findIndex(u => u.id === userId);
      if (idx !== -1) {
        users.splice(idx, 1);
        saveUsers();
        return true;
      }
      return false;
    }

    function generateInviteCodes(count) {
      const newCodes = [];
      for (let i = 0; i < count; i++) {
        let code;
        do { code = generateInviteCode(); } while (inviteCodes.some(c => c.code === code));
        newCodes.push({ code, used: false });
      }
      inviteCodes.push(...newCodes);
      saveInviteCodes();
      return newCodes;
    }

    const app = document.getElementById('app');
    function render() {
      if (!app) return;
      if (currentView === 'login') renderLogin();
      else if (currentView === 'reader') renderReaderHome();
      else if (currentView === 'reading') renderReadingPage();
      else if (currentView === 'admin') renderAdminPanel();
      attachGlobalThemeToggle();
    }

    function attachGlobalThemeToggle() {
      const themeBtn = document.getElementById('globalThemeToggle');
      if (themeBtn) themeBtn.onclick = () => setDarkMode(!darkMode);
    }
    function setDarkMode(enabled) {
      darkMode = enabled;
      if (darkMode) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
      localStorage.setItem('theme', darkMode ? 'dark' : 'light');
      render();
    }

    // ---------- 登录/注册页面（无改动） ----------
    function renderLogin() {
      let mode = 'login';
      let errorMsg = '';
      const switchMode = () => {
        mode = mode === 'login' ? 'register' : 'login';
        renderLoginWithMode();
      };
      const renderLoginWithMode = () => {
        const isLogin = mode === 'login';
        app.innerHTML = `
          <div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="card" style="max-width: 420px; width: 100%; padding: 32px 24px;">
              <div style="text-align: center; margin-bottom: 24px;">
                <i class="fas fa-book-open" style="font-size: 48px; color: var(--brand);"></i>
                <h1 style="margin-top: 12px;">纸间回响</h1>
                <p style="color: var(--text-secondary);">小故事阅读平台</p>
              </div>
              <h2 style="text-align:center; margin-bottom:24px;">${isLogin ? '用户登录' : '用户注册'}</h2>
              <form id="authForm">
                ${!isLogin ? `<input type="text" id="inviteCode" class="input" placeholder="邀请码 *" style="margin-bottom:12px;">` : ''}
                <input type="text" id="phone" class="input" placeholder="手机号 *" style="margin-bottom:12px;">
                <input type="password" id="password" class="input" placeholder="密码 *" style="margin-bottom:12px;">
                ${!isLogin ? `<input type="password" id="confirmPwd" class="input" placeholder="确认密码 *" style="margin-bottom:16px;">` : ''}
                <div id="authError" class="hidden" style="color: #e74c3c; margin-bottom: 16px;">${errorMsg}</div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">${isLogin ? '登录' : '注册'}</button>
              </form>
              <div style="margin-top: 20px; text-align: center;">
                <button id="switchModeBtn" class="link-btn">${isLogin ? '没有账号？使用邀请码注册' : '已有账号？去登录'}</button>
              </div>
            </div>
          </div>
        `;
        const form = document.getElementById('authForm');
        const errorDiv = document.getElementById('authError');
        form.onsubmit = (e) => {
          e.preventDefault();
          const phone = document.getElementById('phone').value.trim();
          const password = document.getElementById('password').value.trim();
          if (!phone || !password) {
            errorDiv.innerText = '请填写手机号和密码';
            errorDiv.classList.remove('hidden');
            return;
          }
          if (isLogin) {
            const adminData = loginAdmin(phone, password);
            if (adminData) {
              currentUser = adminData;
              setLoginToken(adminData);
              currentView = 'admin';
              render();
              return;
            }
          }
          if (mode === 'register') {
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const confirmPwd = document.getElementById('confirmPwd').value.trim();
            if (!inviteCode) {
              errorDiv.innerText = '邀请码不能为空';
              errorDiv.classList.remove('hidden');
              return;
            }
            if (password !== confirmPwd) {
              errorDiv.innerText = '两次输入的密码不一致';
              errorDiv.classList.remove('hidden');
              return;
            }
            const result = registerUser(phone, password, inviteCode);
            if (!result.success) {
              errorDiv.innerText = result.message;
              errorDiv.classList.remove('hidden');
              return;
            }
            const userData = { type: 'user', userId: result.user.id, phone: result.user.phone, nickname: result.user.nickname };
            currentUser = userData;
            setLoginToken(userData);
            currentView = 'reader';
            render();
          } else {
            const userData = loginUser(phone, password);
            if (!userData) {
              errorDiv.innerText = '手机号或密码错误，或账号已被禁用';
              errorDiv.classList.remove('hidden');
              return;
            }
            currentUser = userData;
            setLoginToken(userData);
            currentView = 'reader';
            render();
          }
        };
        document.getElementById('switchModeBtn').onclick = () => { mode = mode === 'login' ? 'register' : 'login'; renderLoginWithMode(); };
      };
      renderLoginWithMode();
    }

    // ---------- 读者首页（增加已读图标） ----------
    function renderReaderHome() {
      const allCategories = [...new Set(stories.map(s => s.category || '未分类').filter(c => c))];
      const userId = currentUser?.type === 'user' ? currentUser.userId : null;
      app.innerHTML = `
        <div class="container" style="padding-bottom: 60px;">
          <div class="top-bar">
            <h1 style="color: var(--brand);">纸间回响</h1>
            <div style="display: flex; gap: 12px;">
              <button id="globalThemeToggle" class="btn btn-outline" style="padding: 8px 12px;"><i class="fas ${darkMode ? 'fa-sun' : 'fa-moon'}"></i></button>
              <button id="logoutBtn" class="btn btn-outline" style="padding: 8px 12px;"><i class="fas fa-sign-out-alt"></i> 退出</button>
            </div>
          </div>
          <div class="category-filter" id="categoryFilter"></div>
          <div style="margin: 16px 0;">
            <div class="input" style="display: flex; align-items: center; gap: 8px; padding: 4px 12px;">
              <i class="fas fa-search" style="color: var(--text-secondary);"></i>
              <input type="text" id="searchInput" placeholder="搜索标题或分类..." style="flex:1; border: none; background: transparent; outline: none; color: var(--text-primary);">
            </div>
          </div>
          <div id="storyGridContainer" class="story-grid"></div>
          <div id="noResult" class="hidden" style="text-align: center; padding: 40px; color: var(--text-secondary);">没有找到故事～</div>
        </div>
      `;
      let currentCategory = '全部';
      const filterContainer = document.getElementById('categoryFilter');
      const searchInput = document.getElementById('searchInput');
      const gridContainer = document.getElementById('storyGridContainer');
      const noResultDiv = document.getElementById('noResult');

      function renderFilterButtons() {
        const categories = ['全部', ...allCategories];
        filterContainer.innerHTML = categories.map(cat => `<button class="filter-btn ${currentCategory === cat ? 'active' : ''}" data-category="${cat}">${cat}</button>`).join('');
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            currentCategory = btn.dataset.category;
            renderFilterButtons();
            renderGrid();
          });
        });
      }

      function renderGrid() {
        const keyword = searchInput.value.toLowerCase();
        let filtered = stories;
        if (currentCategory !== '全部') filtered = filtered.filter(s => (s.category || '未分类') === currentCategory);
        if (keyword) filtered = filtered.filter(s => s.title.toLowerCase().includes(keyword) || (s.category && s.category.toLowerCase().includes(keyword)));
        if (filtered.length === 0) {
          gridContainer.innerHTML = '';
          noResultDiv.classList.remove('hidden');
          return;
        }
        noResultDiv.classList.add('hidden');
        gridContainer.innerHTML = filtered.map(story => {
          const isRead = userId ? isStoryRead(userId, story.id) : false;
          return `
            <div class="story-card" data-id="${story.id}">
              <div class="card-header">
                <div class="card-title">
                  ${escapeHtml(story.title)}
                  ${isRead ? '<i class="fas fa-check-circle read-badge" style="color:#2ecc71;" title="已读"></i>' : ''}
                </div>
                <span class="category-badge">${escapeHtml(story.category || '未分类')}</span>
              </div>
            </div>
          `;
        }).join('');
        document.querySelectorAll('.story-card').forEach(card => {
          card.addEventListener('click', () => {
            currentStoryId = parseInt(card.dataset.id);
            currentView = 'reading';
            render();
          });
        });
      }
      renderFilterButtons();
      searchInput.addEventListener('input', renderGrid);
      renderGrid();
      document.getElementById('logoutBtn').onclick = () => logout();
    }

    // ---------- 阅读页（增加标记已读按钮和已读状态） ----------
    function renderReadingPage() {
      const idx = stories.findIndex(s => s.id === currentStoryId);
      if (idx === -1) { currentView = 'reader'; render(); return; }
      const story = stories[idx];
      const total = stories.length;
      const replyLines = story.hostReply.split('\n').filter(line => line.trim().length > 0);
      const userId = currentUser?.type === 'user' ? currentUser.userId : null;
      const isAlreadyRead = userId ? isStoryRead(userId, story.id) : false;

      app.innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh;">
          <div style="padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg-page);">
            <button id="backToReader" class="btn btn-outline" style="padding: 8px;"><i class="fas fa-arrow-left"></i> 书架</button>
            <span class="page-indicator">${idx+1} / ${total}</span>
            <div style="display: flex; gap: 8px;">
              ${userId && !isAlreadyRead ? `<button id="markReadBtn" class="btn btn-outline" style="padding: 6px 12px;"><i class="fas fa-check"></i> 标记已读</button>` : ''}
              ${userId && isAlreadyRead ? `<span style="color:#2ecc71;"><i class="fas fa-check-circle"></i> 已读</span>` : ''}
              <button id="themeReading" class="btn btn-outline" style="padding: 8px;"><i class="fas ${darkMode ? 'fa-sun' : 'fa-moon'}"></i></button>
            </div>
          </div>
          <div id="readingSwipeArea" class="reading-container" style="flex:1; overflow-y: auto; padding: 20px;">
            <div style="max-width: 800px; margin: 0 auto;">
              <div class="reading-header">
                <div class="reading-title">${escapeHtml(story.title)}</div>
                <span class="reading-category">${escapeHtml(story.category || '未分类')}</span>
              </div>
              <h2 style="display: flex; align-items: center; gap: 8px; margin: 24px 0 12px;"><i class="fas fa-user-circle" style="color: var(--brand);"></i> 连麦者的故事</h2>
              <div style="line-height: 1.6; white-space: pre-wrap; margin-bottom: 32px;">${escapeHtml(story.callerStory)}</div>
              <div style="background: var(--surface); border-radius: 20px; padding: 20px;">
                <h2 style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--brand);"><i class="fas fa-microphone-alt"></i> 主播的回答</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                  ${replyLines.map(line => `<p style="line-height: 1.5;">• ${escapeHtml(line)}</p>`).join('')}
                </div>
              </div>
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg-page);">
            <button id="prevPageBtn" class="btn btn-outline" ${idx===0 ? 'disabled style="opacity:0.3; pointer-events:none;"' : ''}><i class="fas fa-chevron-left"></i> 上一篇</button>
            <button id="nextPageBtn" class="btn btn-outline" ${idx===total-1 ? 'disabled style="opacity:0.3; pointer-events:none;"' : ''}>下一篇 <i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
      `;

      // 标记已读按钮事件
      if (userId && !isAlreadyRead) {
        const markBtn = document.getElementById('markReadBtn');
        if (markBtn) {
          markBtn.onclick = () => {
            markStoryRead(userId, story.id);
            // 重新渲染当前页面以更新按钮状态
            renderReadingPage();
          };
        }
      }

      document.getElementById('themeReading').onclick = () => setDarkMode(!darkMode);
      document.getElementById('backToReader').onclick = () => { currentView = 'reader'; render(); };
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      if (prevBtn && idx > 0) prevBtn.onclick = () => { currentStoryId = stories[idx-1].id; render(); };
      if (nextBtn && idx < total-1) nextBtn.onclick = () => { currentStoryId = stories[idx+1].id; render(); };
      const swipeArea = document.getElementById('readingSwipeArea');
      let touchStartX = 0, touchEndX = 0;
      swipeArea.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
      swipeArea.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 40) {
          if (diff > 0 && idx < total-1) { currentStoryId = stories[idx+1].id; render(); }
          else if (diff < 0 && idx > 0) { currentStoryId = stories[idx-1].id; render(); }
        }
      });
      const keyHandler = (e) => {
        if (currentView !== 'reading') return;
        if (e.key === 'ArrowLeft' && idx > 0) { currentStoryId = stories[idx-1].id; render(); }
        else if (e.key === 'ArrowRight' && idx < total-1) { currentStoryId = stories[idx+1].id; render(); }
      };
      window.removeEventListener('keydown', keyHandler);
      window.addEventListener('keydown', keyHandler);
    }

    // ---------- 管理后台（完全不变） ----------
    function renderAdminPanel() {
      let editingStoryId = null;

      function renderAdminUI() {
        const storyListHtml = stories.map(s => `
          <div class="story-row" data-id="${s.id}" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border);">
            <span>${escapeHtml(s.title)} <span style="font-size:0.7rem; background:var(--brand); color:white; padding:2px 6px; border-radius:12px;">${escapeHtml(s.category || '未分类')}</span></span>
            <div>
              <button class="edit-story" data-id="${s.id}" style="background:none; border:none; color:var(--brand); margin-right:12px; cursor:pointer;"><i class="fas fa-edit"></i></button>
              <button class="delete-story" data-id="${s.id}" style="background:none; border:none; color:#e74c3c; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `).join('');
        const inviteListHtml = inviteCodes.map(inv => `
          <tr>
            <td>${escapeHtml(inv.code)}</td>
            <td>${inv.used ? '<span class="status-badge status-used">已使用</span>' : '<span class="status-badge status-active">未使用</span>'}</td>
            <td>${inv.used ? (users.find(u=>u.id===inv.usedByUserId)?.phone || '') : '-'}</td>
            <td>${inv.usedAt ? new Date(inv.usedAt).toLocaleDateString() : '-'}</td>
          </tr>
        `).join('');
        const userListHtml = users.map(u => `
          <tr>
            <td>${escapeHtml(u.phone)}</td>
            <td>${escapeHtml(u.nickname)}</td>
            <td>${escapeHtml(u.inviteCode)}</td>
            <td><span class="status-badge ${u.status === 'active' ? 'status-active' : 'status-disabled'}">${u.status === 'active' ? '启用' : '禁用'}</span></td>
            <td>${new Date(u.createdAt).toLocaleDateString()}</td>
            <td style="white-space: nowrap;">
              <button class="toggle-user" data-id="${u.id}" style="background:none; border:none; color:var(--brand); cursor:pointer; margin-right:8px;"><i class="fas ${u.status === 'active' ? 'fa-ban' : 'fa-check-circle'}"></i></button>
              <button class="delete-user" data-id="${u.id}" style="background:none; border:none; color:#e74c3c; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
        app.innerHTML = `
          <div class="container" style="padding: 20px 0 60px;">
            <div class="top-bar">
              <h1 style="color: var(--brand);">📚 管理后台</h1>
              <div style="display: flex; gap: 12px;">
                <button id="globalThemeToggle" class="btn btn-outline"><i class="fas ${darkMode ? 'fa-sun' : 'fa-moon'}"></i></button>
                <button id="adminLogoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> 退出</button>
              </div>
            </div>
            <div class="admin-tabs">
              <button class="tab-btn ${adminTab === 'stories' ? 'active' : ''}" data-tab="stories">📖 故事管理</button>
              <button class="tab-btn ${adminTab === 'invite' ? 'active' : ''}" data-tab="invite">🎟️ 邀请码管理</button>
              <button class="tab-btn ${adminTab === 'users' ? 'active' : ''}" data-tab="users">👥 用户管理</button>
            </div>
            <div id="storiesView" class="${adminTab === 'stories' ? '' : 'hidden'}">
              <div class="admin-layout">
                <div class="card" style="padding: 24px;">
                  <h2 id="formTitle" style="margin-bottom:20px;">${editingStoryId ? '编辑故事' : '新增故事'}</h2>
                  <form id="storyForm">
                    <input type="text" id="storyTitle" class="input" placeholder="标题 *" style="margin-bottom:12px;">
                    <input type="text" id="storyCategory" class="input" placeholder="分类 *" style="margin-bottom:12px;">
                    <textarea id="storyCaller" class="input" rows="4" placeholder="连麦者的故事 *" style="margin-bottom:12px;"></textarea>
                    <textarea id="storyReply" class="input" rows="6" placeholder="主播回答 (每句换行) *" style="margin-bottom:16px;"></textarea>
                    <div style="display: flex; gap: 12px;">
                      <button type="submit" class="btn btn-primary" style="flex:1;" id="submitStoryBtn">${editingStoryId ? '更新故事' : '添加故事'}</button>
                      <button type="button" id="cancelStoryEdit" class="btn btn-outline">取消</button>
                    </div>
                  </form>
                </div>
                <div class="card" style="padding: 24px;">
                  <h2 style="margin-bottom:16px;">已有故事 (${stories.length})</h2>
                  <div id="storyListContainer" style="max-height:60vh; overflow-y:auto;">${storyListHtml}</div>
                </div>
              </div>
            </div>
            <div id="inviteView" class="${adminTab === 'invite' ? '' : 'hidden'}">
              <div class="card" style="padding: 24px; margin-bottom:24px;">
                <h2 style="margin-bottom:16px;">生成邀请码</h2>
                <div style="display: flex; gap:12px; align-items: flex-end;">
                  <div style="flex:1;">
                    <label>生成数量</label>
                    <input type="number" id="inviteCount" class="input" value="10" min="1" max="1000">
                  </div>
                  <button id="generateInviteBtn" class="btn btn-primary">生成</button>
                </div>
              </div>
              <div class="card" style="padding: 24px;">
                <h2 style="margin-bottom:16px;">邀请码列表 (${inviteCodes.length})</h2>
                <div style="overflow-x: auto;">
                  <table class="invite-table">
                    <thead><tr><th>邀请码</th><th>状态</th><th>使用用户</th><th>使用时间</th></tr></thead>
                    <tbody>${inviteListHtml || '<tr><td colspan="4">暂无邀请码</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            </div>
            <div id="usersView" class="${adminTab === 'users' ? '' : 'hidden'}">
              <div class="card" style="padding: 24px;">
                <h2 style="margin-bottom:16px;">用户列表 (${users.length})</h2>
                <div style="overflow-x: auto;">
                  <table class="user-table">
                    <thead><tr><th>手机号</th><th>昵称</th><th>邀请码</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
                    <tbody>${userListHtml || '<tr><td colspan="6">暂无用户</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;

        // 编辑按钮事件
        const editButtons = document.querySelectorAll('.edit-story');
        editButtons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            const story = stories.find(s => s.id === id);
            if (story) {
              editingStoryId = story.id;
              document.getElementById('storyTitle').value = story.title;
              document.getElementById('storyCategory').value = story.category || '';
              document.getElementById('storyCaller').value = story.callerStory;
              document.getElementById('storyReply').value = story.hostReply;
              document.getElementById('formTitle').innerText = '编辑故事';
              document.getElementById('submitStoryBtn').innerText = '更新故事';
            }
          });
        });

        // 删除按钮事件
        const deleteButtons = document.querySelectorAll('.delete-story');
        deleteButtons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            if (confirm('确定删除这个故事吗？')) {
              stories = stories.filter(s => s.id !== id);
              saveStories();
              renderAdminPanel();
            }
          });
        });

        // 故事表单提交
        const storyForm = document.getElementById('storyForm');
        if (storyForm) {
          storyForm.onsubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById('storyTitle').value.trim();
            const category = document.getElementById('storyCategory').value.trim() || '未分类';
            const callerStory = document.getElementById('storyCaller').value.trim();
            const hostReply = document.getElementById('storyReply').value.trim();
            if (!title || !callerStory || !hostReply) { alert('请填写所有必填字段'); return; }
            if (editingStoryId !== null) {
              const index = stories.findIndex(s => s.id === editingStoryId);
              if (index !== -1) stories[index] = { ...stories[index], title, category, callerStory, hostReply };
              editingStoryId = null;
            } else {
              const newId = stories.length > 0 ? Math.max(...stories.map(s => s.id)) + 1 : 1;
              stories.push({ id: newId, title, category, callerStory, hostReply });
            }
            saveStories();
            document.getElementById('storyForm').reset();
            editingStoryId = null;
            document.getElementById('formTitle').innerText = '新增故事';
            document.getElementById('submitStoryBtn').innerText = '添加故事';
            renderAdminPanel();
          };
        }
        const cancelStory = document.getElementById('cancelStoryEdit');
        if (cancelStory) cancelStory.onclick = () => { editingStoryId = null; renderAdminPanel(); };

        // 邀请码生成
        const generateBtn = document.getElementById('generateInviteBtn');
        if (generateBtn) {
          generateBtn.onclick = () => {
            const count = parseInt(document.getElementById('inviteCount').value) || 10;
            if (count > 0 && count <= 1000) {
              generateInviteCodes(count);
              renderAdminPanel();
            } else { alert('数量范围1-1000'); }
          };
        }

        // 用户管理事件
        const toggleBtns = document.querySelectorAll('.toggle-user');
        toggleBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            toggleUserStatus(parseInt(btn.dataset.id));
            renderAdminPanel();
          });
        });
        const delUserBtns = document.querySelectorAll('.delete-user');
        delUserBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.id);
            if (confirm('确定删除该用户吗？删除后不可恢复，且该用户使用的邀请码不会释放。')) {
              deleteUser(id);
              renderAdminPanel();
            }
          });
        });

        // Tab切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = () => { adminTab = btn.dataset.tab; renderAdminPanel(); };
        });
        document.getElementById('adminLogoutBtn').onclick = () => logout();
      }
      renderAdminUI();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function initAutoLogin() {
      const tokenData = getLoginToken();
      if (tokenData) {
        if (tokenData.type === 'admin') {
          currentUser = { type: 'admin' };
          currentView = 'admin';
        } else if (tokenData.type === 'user') {
          const userExists = users.find(u => u.id === tokenData.userId && u.status === 'active');
          if (userExists) {
            currentUser = tokenData;
            currentView = 'reader';
          } else {
            clearLoginToken();
          }
        }
      }
      render();
    }
    initAutoLogin();
  </script>
</body>
</html>
