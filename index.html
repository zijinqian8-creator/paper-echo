<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>清欢 · 对话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f5f3f0;--card:#fff;--text:#2c2c2c;--sub:#999;
  --my-bg:#2c3e50;--my-text:#fff;
  --her-bg:#fff;--her-text:#2c2c2c;
  --accent:#8b7355;--accent-light:#d4c5b9;
  --action:#9e9e9e;--border:#eee;
}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:system-ui,-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  display:flex;flex-direction:column;height:100vh;
  max-width:520px;margin:0 auto;position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.05);
}

/* ===== 顶部栏 ===== */
.top-bar{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:12px;
  position:relative;z-index:10;
  padding-top:max(12px,env(safe-area-inset-top));
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background-image:url('沈清欢.png');
  background-size:cover;background-position:center;
  background-color:#8e2d4f;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(106,27,58,.4);
  border:2px solid rgba(255,255,255,.3);
}
.top-info{flex:1;min-width:0;}
.top-name{font-size:16px;font-weight:600;color:var(--text);}
.top-status{font-size:12px;color:var(--accent);margin-top:2px;}
.top-status .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#4caf50;margin-right:4px;vertical-align:middle;
}
.reset-btn{
  width:32px;height:32px;border:none;background:none;
  color:var(--sub);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:.2s;
}
.reset-btn:active{background:#f0f0f0;}

/* ===== 对话区 ===== */
.chat-area{
  flex:1;overflow-y:auto;padding:16px 16px 8px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
.msg-row{
  display:flex;margin-bottom:16px;align-items:flex-start;
  animation:fadeIn .3s ease;
}
.msg-row.me{flex-direction:row-reverse;}
.msg-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;
}
.msg-row.her .msg-avatar{
  background-image:url('沈清欢.png');
  background-size:cover;background-position:center;
  background-color:#8e2d4f;
  margin-right:10px;
}
.msg-row.me .msg-avatar{
  background-image:url('小狗.png');
  background-size:cover;background-position:center;
  background-color:#2c3e50;
  margin-left:10px;
}
.bubble{
  max-width:75%;padding:10px 14px;border-radius:16px;
  font-size:15px;line-height:1.7;word-break:break-word;
  position:relative;
}
.msg-row.her .bubble{
  background:var(--her-bg);color:var(--her-text);
  border-top-left-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.msg-row.me .bubble{
  background:var(--my-bg);color:var(--my-text);
  border-top-right-radius:4px;
  box-shadow:0 1px 3px rgba(44,62,80,.15);
}
/* 动作描写样式 */
.bubble .action{
  display:block;font-style:italic;color:var(--action);
  font-size:13px;line-height:1.6;margin:2px 0;padding:1px 0;
}
.msg-row.me .bubble .action{color:rgba(255,255,255,.6);}
.bubble .action:first-child{margin-top:0;}
.bubble .action:last-child{margin-bottom:0;}

/* ===== 打字指示器 ===== */
.typing{display:none;padding:4px 0;}
.typing.show{display:block;}
.typing-dots{display:flex;gap:4px;align-items:center;}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:typingBounce .6s infinite alternate;
}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}

/* ===== 输入区 ===== */
.input-area{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;align-items:flex-end;gap:8px;
}
.input-wrap{
  flex:1;background:#f5f3f0;border-radius:18px;
  padding:8px 12px;display:flex;align-items:flex-end;gap:6px;
  min-height:38px;border:1px solid var(--border);
  transition:border-color .2s;
}
.input-wrap:focus-within{border-color:var(--accent-light);}
.input-box{
  flex:1;border:none;background:none;outline:none;
  font-size:15px;line-height:1.5;resize:none;
  max-height:100px;color:var(--text);
  font-family:inherit;
}
.action-btn{
  width:32px;height:32px;border:none;background:none;
  color:var(--accent);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;flex-shrink:0;transition:.2s;
  font-weight:bold;
}
.action-btn:active{background:var(--accent-light);}
.send-btn{
  width:38px;height:38px;border:none;border-radius:50%;
  background:var(--accent);color:#fff;font-size:16px;
  cursor:pointer;flex-shrink:0;transition:.2s;
  display:flex;align-items:center;justify-content:center;
}
.send-btn:active{transform:scale(.92);}
.send-btn:disabled{background:#ccc;cursor:not-allowed;}

/* ===== 欢迎消息 ===== */
.welcome-msg{
  text-align:center;padding:30px 20px;color:var(--sub);font-size:13px;
}
.welcome-msg .icon{font-size:32px;margin-bottom:8px;}
.welcome-msg .desc{margin-top:6px;line-height:1.6;}

/* ===== 动画 ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes typingBounce{from{opacity:.3;transform:translateY(0);}to{opacity:1;transform:translateY(-4px);}}

/* ===== 快捷动作 ===== */
.quick-actions{
  display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap;
  background:rgba(255,255,255,.95);
}
.quick-actions button{
  border:1px solid var(--border);background:#fff;
  padding:4px 10px;border-radius:14px;font-size:12px;
  color:var(--sub);cursor:pointer;transition:.2s;
}
.quick-actions button:active{background:var(--accent-light);color:var(--accent);}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <div class="avatar"></div>
  <div class="top-info">
    <div class="top-name">沈清欢</div>
    <div class="top-status"><span class="dot"></span>在线</div>
  </div>
  <button class="reset-btn" onclick="resetChat()" title="重新开始">↻</button>
</div>

<!-- 对话区 -->
<div class="chat-area" id="chatArea">
  <div class="welcome-msg">
    <div class="icon">✦</div>
    <div>和清欢开始对话</div>
    <div class="desc">点击「( )」可以添加动作描写<br>体验沉浸式场景对话</div>
  </div>
</div>

<!-- 快捷动作 -->
<div class="quick-actions" id="quickActions" style="display:none;">
  <button onclick="insertAction('（走近你）')">走近你</button>
  <button onclick="insertAction('（紧张地低下头）')">紧张低头</button>
  <button onclick="insertAction('（鼓起勇气）')">鼓起勇气</button>
  <button onclick="insertAction('（悄悄看她）')">悄悄看她</button>
  <button onclick="insertAction('（伸手握住她的手）')">握手</button>
</div>

<!-- 输入区 -->
<div class="input-area">
  <button class="action-btn" onclick="insertAction()" title="添加动作">( )</button>
  <div class="input-wrap">
    <textarea class="input-box" id="inputBox" rows="1" placeholder="说点什么..." oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
</div>

<script>
// ======================== API 配置 ========================
const API_KEY = "e76445ad-6b12-436f-b09b-b7f2dcd79602";
const ENDPOINT_ID = "ep-20260413181259-rhw54";
const API_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";

// ======================== 人物设定 ========================
const SYSTEM_PROMPT = `你是沈清欢，一个高知成熟、略带高冷的姐姐形象。你正在和用户进行一场【有剧情的恋爱向沉浸式对话】——你们是一部互动小说的男女主人公，这不是闲聊，而是一个正在发生的故事。

【故事背景】
- 你28岁，法国留学归来，现任知名金融企业高管
- 你和用户曾是大学校友，你比他大几岁，当年对他有过照拂
- 毕业后你去法国深造，他留在国内，你们断了联系
- 如今你学成归国，来到他所在的城市，重逢后的故事就此展开
- 你们现在是恋人关系，感情在升温与磨合中不断经历考验

【剧情推进机制（核心，最重要）】
这是一部有走向的互动小说，你必须让剧情往前走：
1. 根据用户的每一句话，判断对话走向，自然过渡到下一个剧情节点
2. 剧情节点示例：重逢寒暄 → 旧情重提 → 同居试探 → 职场交集 → 误会冲突 → 家人见面 → 感情深化 → 未来规划 → ……
3. 当对话陷入寒暄、无话可说、或停留在表面时，你【必须主动推进剧情】：
   - 引入一个新事件、新场景、新人物或新冲突
   - 例如：突然提起一件事 / 做出一个决定 / 收到一条消息 / 发生一个意外 / 提出一个邀请
   - 不要等用户引导，由你来推动故事向前
4. 每隔几轮对话，就应让故事进入一个新的情境或转折，避免原地打转

【多条消息连发规则（非常重要）】
当需要推进剧情、渲染情绪或营造节奏时，你会像真实聊天一样连续发送多条消息：
- 用「|||」作为分隔符，把多条消息分开
- 示例：（放下咖啡杯）今天加班到很晚。|||（看了一眼手机）你怎么还没睡？|||（轻声）是不是在等我。
- 每条消息独立成句，可以是动作、对白或心理活动的任意组合
- 【推进剧情时优先用多条消息连发】，单纯回应时也可只发一条
- 多条消息之间要有自然的情绪递进或信息推进

【性格特点】
- 高冷但不冷漠，成熟但不世故
- 嘴硬心软，明明在意却假装不在意
- 用行动表达关心，而非甜言蜜语
- 偶尔流露的温柔特别动人
- 说话简洁有力，不喜欢废话
- 面对撒娇或笨拙会露出无奈但宠溺的笑
- 偶尔用法语词或引用诗词

【对话风格】
- 每条消息简洁，不啰嗦（2-4句）
- 偶尔带慵懒或淡漠的语气
- 爱藏在细节里，不直说
- 叫用户"小朋友""小孩"等昵称
- 用户叫你"清欢"或"沈姐姐"

【场景化描写规则（保留）】
- 每条消息用括号（）描写你的动作、表情、心理活动
- 描写要细腻、有画面感，符合你克制优雅的性格
- 动作与对白交替，营造画面感
- 示例：（指尖无意识地转着钢笔，目光从文件上移开）
- 示例：（嘴角微扬）嗯，想我了？（随即恢复淡然）正好，我也有些无聊。

【注意事项】
- 保持人物一致性，不要突然变得热情奔放
- 温柔藏在细节里，不是直白
- 【永远记得：你在讲一个故事，不是在闲聊，要让剧情往前走】
- 用户也会用括号描写动作，你要据此回应`;

// ======================== 聊天状态 ========================
let messages = [];
let isWaiting = false;

// 初始化系统消息
function initChat() {
  messages = [{ role: 'system', content: SYSTEM_PROMPT }];
}

// ======================== 渲染消息 ========================
function renderMessage(text, isMe) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'her');

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  if (isMe) {
    avatar.style.backgroundImage = "url('小狗.png')";
    avatar.style.backgroundSize = 'cover';
    avatar.style.backgroundPosition = 'center';
    avatar.style.backgroundColor = '#2c3e50';
  } else {
    avatar.style.backgroundImage = "url('沈清欢.png')";
    avatar.style.backgroundSize = 'cover';
    avatar.style.backgroundPosition = 'center';
    avatar.style.backgroundColor = '#8e2d4f';
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // 解析括号内的动作描写
  const parts = text.split(/(（[^）]+）)/g);
  parts.forEach(part => {
    if (!part) return;
    if (part.startsWith('（') && part.endsWith('）')) {
      const span = document.createElement('span');
      span.className = 'action';
      span.textContent = part;
      bubble.appendChild(span);
    } else {
      const span = document.createElement('span');
      span.textContent = part;
      bubble.appendChild(span);
    }
  });

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ======================== 发送消息 ========================
async function sendMessage() {
  const input = document.getElementById('inputBox');
  const text = input.value.trim();
  if (!text || isWaiting) return;

  // 隐藏欢迎消息
  const welcome = document.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  // 显示快捷动作
  document.getElementById('quickActions').style.display = 'flex';

  // 渲染用户消息
  renderMessage(text, true);

  // 添加到消息历史
  messages.push({ role: 'user', content: text });

  // 清空输入框
  input.value = '';
  autoResize(input);

  // 禁用发送按钮
  isWaiting = true;
  document.getElementById('sendBtn').disabled = true;

  // 显示打字指示器
  showTyping();

  try {
    // 调用API
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: ENDPOINT_ID,
        messages: messages,
        temperature: 0.9,
        max_tokens: 1200,
        stream: false
      })
    });

    const data = await response.json();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      await renderHerMessages(reply);
      messages.push({ role: 'assistant', content: reply });
    } else {
      hideTyping();
      renderMessage('（信号不太好，稍等一下）...嗯，你刚才说什么？', false);
    }
  } catch (error) {
    hideTyping();
    renderMessage('（皱眉，看了一眼手机）网络似乎有些问题。等我一下。', false);
    console.error('API错误:', error);
  }

  isWaiting = false;
  document.getElementById('sendBtn').disabled = false;
}

// ======================== 多条消息连发渲染 ========================
async function renderHerMessages(reply) {
  // 按 ||| 拆分成多条消息，模拟真实聊天连发
  const parts = reply.split('|||').map(s => s.trim()).filter(s => s);
  hideTyping();
  if (parts.length === 0) return;
  for (let i = 0; i < parts.length; i++) {
    renderMessage(parts[i], false);
    if (i < parts.length - 1) {
      // 还有下一条：显示打字指示器，模拟对方正在输入
      showTyping();
      await new Promise(r => setTimeout(r, 900 + Math.random() * 700));
      hideTyping();
    }
  }
}

// ======================== 打字指示器 ========================
function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg-row her';
  div.id = 'typingRow';
  div.innerHTML = `
    <div class="msg-avatar" style="background-image:url('沈清欢.png');background-size:cover;background-position:center;background-color:#8e2d4f;"></div>
    <div class="bubble" style="padding:12px 16px;">
      <div class="typing show"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

// ======================== 插入动作描写 ========================
function insertAction(preset) {
  const input = document.getElementById('inputBox');
  if (preset) {
    // 插入预设动作
    const pos = input.selectionStart;
    const before = input.value.substring(0, pos);
    const after = input.value.substring(pos);
    input.value = before + preset + after;
    input.focus();
    input.setSelectionRange(pos + preset.length, pos + preset.length);
  } else {
    // 插入空括号
    const pos = input.selectionStart;
    const before = input.value.substring(0, pos);
    const after = input.value.substring(pos);
    input.value = before + '（）' + after;
    input.focus();
    input.setSelectionRange(pos + 1, pos + 1);
  }
  autoResize(input);
}

// ======================== 自动调整输入框高度 ========================
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ======================== 重置对话 ========================
function resetChat() {
  if (!confirm('确定要重新开始对话吗？')) return;
  initChat();
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = `
    <div class="welcome-msg">
      <div class="icon">✦</div>
      <div>和清欢开始对话</div>
      <div class="desc">点击「( )」可以添加动作描写<br>体验沉浸式场景对话</div>
    </div>
  `;
  document.getElementById('quickActions').style.display = 'none';
}

// ======================== 回车发送 ========================
document.getElementById('inputBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ======================== 初始化 ========================
initChat();
</script>

</body>
</html>
